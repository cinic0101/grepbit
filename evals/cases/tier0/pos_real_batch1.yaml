# Batch 1: the owner's 50 questions on the real POS test database, settled as
# a regression set on 2026-09-09 after four judged runs (docs/research/holdout-01.md,
# holdout-02-overlay-and-time.md). Reference SQL of an answered case is the SQL the
# system produced in run 4, judged correct by the owner, with the bound values
# inlined: a regression guard, not an independent truth. Refusal cases accept any
# typed refusal. q29 and q44 are the owner's value-grounded rewrites (q29b, q44b).
# Returns (origin_transaction_no set) are excluded by default per the overlay.
# The seven ratio and share questions (q10, q17, q21, q34, q41, q49, q50) were refusals
# until prompt v10; their references come from the run the owner judged on 2026-09-10
# (docs/research/ratios-01.md).
# Run with --enum-distinct-limit 0 --redact-rows --overlay overlays/pos_real.json.
datasource_id: pos_real
as_of: '2026-02-04T18:00:00+08:00'
cases:
- case_id: q01
  question: 銷售交易總共有幾筆？
  expected:
    status: answered
  reference_sql: SELECT COUNT(*) AS row_count FROM public.pos_sale WHERE pos_sale.origin_transaction_no IS NULL
- case_id: q02
  question: 所有銷售交易的總金額是多少？
  expected:
    status: answered
  reference_sql: SELECT SUM(pos_sale.total_amount) AS sum_total_amount FROM public.pos_sale WHERE pos_sale.origin_transaction_no IS NULL
- case_id: q03
  question: 已付款訂單的總金額是多少？
  expected:
    status: answered
  reference_sql: SELECT SUM(pos_payment.payment_amount) AS paid_amount FROM public.pos_payment LEFT JOIN public.pos_sale ON pos_payment.transaction_no = pos_sale.transaction_no WHERE pos_sale.origin_transaction_no IS NULL
- case_id: q04
  question: 取消的訂單有幾筆？
  expected:
    status: semantic_gap
  accept_statuses: &id001
  - semantic_gap
  - clarify
  - unsupported
  note: 'run 4 reason: absent_concept'
- case_id: q05
  question: 各訂單狀態的交易筆數是多少？
  expected:
    status: semantic_gap
  accept_statuses: *id001
  note: 'run 4 reason: absent_concept'
- case_id: q06
  question: 訂單筆數最多的狀態是哪一種？若同數，請依狀態名稱由小到大取第一個。
  expected:
    status: semantic_gap
  accept_statuses: *id001
  note: 'run 4 reason: semantic_gap'
- case_id: q07
  question: 每筆訂單的平均金額是多少？
  expected:
    status: answered
  reference_sql: SELECT AVG(pos_sale.total_amount) AS average_ticket FROM public.pos_sale WHERE pos_sale.origin_transaction_no IS NULL
- case_id: q08
  question: 各付款方式的付款總額是多少？請依付款方式名稱由小到大排列。
  expected:
    status: answered
  reference_sql: SELECT pos_payment.payment_method AS payment_method, SUM(pos_payment.payment_amount) AS paid_amount FROM public.pos_payment LEFT JOIN public.pos_sale ON pos_payment.transaction_no = pos_sale.transaction_no WHERE pos_sale.origin_transaction_no IS NULL GROUP BY pos_payment.payment_method ORDER BY payment_method NULLS FIRST
