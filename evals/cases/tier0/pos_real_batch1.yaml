  expected:
    status: answered
  reference_sql: SELECT pos_payment.payment_method AS payment_method, CAST((SUM(pos_payment.payment_amount)) AS DOUBLE PRECISION) / NULLIF(SUM(SUM(pos_payment.payment_amount)) OVER (), 0) AS paid_amount_share FROM public.pos_payment LEFT JOIN public.pos_sale ON pos_payment.transaction_no = pos_sale.transaction_no WHERE pos_sale.origin_transaction_no IS NULL GROUP BY pos_payment.payment_method ORDER BY payment_method NULLS FIRST
  note: 'ratio or share question: refused until prompt v10; answered form judged correct by the owner on 2026-09-10 (docs/research/ratios-01.md); reference from pos-real-batch1-14.json'
