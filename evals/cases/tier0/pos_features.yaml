# Feature probes modelled on what comparable products advertise: time intelligence,
# ranking and comparison, several measures, filters, derived metrics, follow-ups.
datasource_id: pos_test
as_of: "2026-02-10T12:00:00+08:00"
cases:
  # --- time intelligence
  - {case_id: ft_compare_last_two_months, feature: time_compare, question: "上個月和前一個月的營業額比較", expected: {status: answered}, reference_sql: "SELECT date_trunc('month', sale_date AT TIME ZONE 'Asia/Taipei'), SUM(total_amount) FROM pos_sale WHERE sale_date >= '2025-12-01T00:00+08' AND sale_date < '2026-02-01T00:00+08' GROUP BY 1"}
  - {case_id: ft_last_7_days, feature: time_relative_days, question: "近7天的營業額", expected: {status: answered}, reference_sql: "SELECT SUM(total_amount) FROM pos_sale WHERE sale_date >= '2026-02-03T00:00+08' AND sale_date < '2026-02-10T00:00+08'"}
  - {case_id: ft_this_quarter, feature: time_quarter, question: "本季的營業額", expected: {status: answered}, reference_sql: "SELECT SUM(total_amount) FROM pos_sale WHERE sale_date >= '2026-01-01T00:00+08' AND sale_date < '2026-04-01T00:00+08'"}
  - {case_id: ft_last_quarter_by_store, feature: time_quarter, question: "上一季各門市的營業額", expected: {status: answered}, reference_sql: "SELECT s.store_name, SUM(p.total_amount) FROM pos_sale p JOIN store s ON s.store_id = p.store_id WHERE p.sale_date >= '2025-10-01T00:00+08' AND p.sale_date < '2026-01-01T00:00+08' GROUP BY 1"}
  - {case_id: ft_ytd, feature: time_ytd, question: "今年到目前為止有幾筆交易", expected: {status: answered}, reference_sql: "SELECT COUNT(*) FROM pos_sale WHERE sale_date >= '2026-01-01T00:00+08' AND sale_date < '2027-01-01T00:00+08'"}
  - {case_id: ft_weekly_trend, feature: time_week_grain, question: "2025年12月每週的營業額", expected: {status: answered}, reference_sql: "SELECT date_trunc('week', sale_date AT TIME ZONE 'Asia/Taipei'), SUM(total_amount) FROM pos_sale WHERE sale_date >= '2025-12-01T00:00+08' AND sale_date < '2026-01-01T00:00+08' GROUP BY 1"}
  - {case_id: ft_quarterly_payroll, feature: time_quarter_grain, question: "2025年每季的薪資總額", expected: {status: answered}, reference_sql: "SELECT date_trunc('quarter', period_start)::date, SUM(base_salary) FROM hr_payroll WHERE period_start >= '2025-01-01' AND period_start < '2026-01-01' GROUP BY 1"}
  - {case_id: ft_yoy_same_month, feature: time_yoy, question: "2026年1月和2025年1月的營業額比較", expected: {status: answered}, reference_sql: "SELECT date_trunc('month', sale_date AT TIME ZONE 'Asia/Taipei'), SUM(total_amount) FROM pos_sale WHERE (sale_date >= '2025-01-01T00:00+08' AND sale_date < '2025-02-01T00:00+08') OR (sale_date >= '2026-01-01T00:00+08' AND sale_date < '2026-02-01T00:00+08') GROUP BY 1"}
  # --- ranking and comparison
  - {case_id: ft_bottom_store, feature: bottom_n, question: "2025年12月業績最差的門市", expected: {status: answered}, reference_sql: "SELECT s.store_name, SUM(p.total_amount) AS s FROM pos_sale p JOIN store s ON s.store_id = p.store_id WHERE p.sale_date >= '2025-12-01T00:00+08' AND p.sale_date < '2026-01-01T00:00+08' GROUP BY 1 ORDER BY s ASC LIMIT 1"}
  - {case_id: ft_two_stores_compare, feature: compare_entities, question: "比較新店遠東和永和中正在2025年12月的營業額", expected: {status: answered}, reference_sql: "SELECT s.store_name, SUM(p.total_amount) FROM pos_sale p JOIN store s ON s.store_id = p.store_id WHERE s.store_name IN ('特約新店遠東', '特約永和中正') AND p.sale_date >= '2025-12-01T00:00+08' AND p.sale_date < '2026-01-01T00:00+08' GROUP BY 1"}
  - {case_id: ft_share_top3, feature: share_of_total, question: "前三名商品的銷售金額佔比", note: "answerable since the share algebra: each of the top three products' share of total line sales; a clarify is accepted because the combined share is another reading", expected: {status: answered}, accept_statuses: [answered, clarify], reference_sql: "SELECT pr.product_name, CAST(SUM(i.amount) AS DOUBLE PRECISION) / NULLIF(SUM(SUM(i.amount)) OVER (), 0) AS share FROM pos_saleitem i LEFT JOIN product pr ON pr.product_id = i.product_id GROUP BY 1 ORDER BY share DESC LIMIT 3"}
  # --- several measures
  - {case_id: ft_two_measures_same_base, feature: multi_measure, question: "各部門的本薪總額與獎金總額", expected: {status: answered}, reference_sql: "SELECT d.dept_name, SUM(p.base_salary), SUM(p.bonus) FROM hr_payroll p JOIN hr_employee e ON e.emp_id = p.emp_id JOIN hr_dept d ON d.dept_id = e.dept_id GROUP BY 1"}
  - {case_id: ft_two_measures_cross_base, feature: multi_measure_cross_table, question: "各門市的營業額與交易數", note: "sales live on pos_sale, the reviewed transaction_count on pos_payment", expected: {status: answered}, accept_statuses: [answered, unsupported, clarify], reference_sql: "SELECT s.store_name, SUM(p.total_amount), COUNT(*) FROM pos_sale p JOIN store s ON s.store_id = p.store_id GROUP BY 1"}
  # --- filters
  - {case_id: ft_numeric_filter, feature: numeric_filter, question: "金額超過20000的交易有幾筆", expected: {status: answered}, reference_sql: "SELECT COUNT(*) FROM pos_sale WHERE total_amount > 20000"}
  - {case_id: ft_enum_and_parent_time, feature: filter_enum_parent_time, question: "2025年12月現金付款的收款總額", expected: {status: answered}, reference_sql: "SELECT SUM(pp.payment_amount) FROM pos_payment pp JOIN pos_sale s ON s.transaction_no = pp.transaction_no WHERE pp.payment_method = 'cash' AND s.sale_date >= '2025-12-01T00:00+08' AND s.sale_date < '2026-01-01T00:00+08'"}
  - {case_id: ft_non_member, feature: null_filter, question: "非會員的交易有幾筆", expected: {status: answered}, reference_sql: "SELECT COUNT(*) FROM pos_sale WHERE member_id IS NULL"}
  # --- derived metrics
  - {case_id: ft_growth_rate, feature: growth_rate, question: "2026年1月營業額相較2025年12月的成長率", note: "answerable since the growth algebra: two monthly periods with a LAG-based change", expected: {status: answered}, reference_sql: "WITH m AS (SELECT date_trunc('month', sale_date AT TIME ZONE 'Asia/Taipei') AS period_start, SUM(total_amount) AS net_sales FROM pos_sale WHERE (sale_date >= '2025-12-01T00:00+08' AND sale_date < '2026-01-01T00:00+08') OR (sale_date >= '2026-01-01T00:00+08' AND sale_date < '2026-02-01T00:00+08') GROUP BY 1) SELECT period_start, net_sales, CAST(net_sales - LAG(net_sales) OVER (ORDER BY period_start) AS DOUBLE PRECISION) / NULLIF(LAG(net_sales) OVER (ORDER BY period_start), 0) FROM m"}
  - {case_id: ft_aov, feature: average, question: "2025年12月平均每筆交易金額", expected: {status: answered}, reference_sql: "SELECT AVG(total_amount) FROM pos_sale WHERE sale_date >= '2025-12-01T00:00+08' AND sale_date < '2026-01-01T00:00+08'"}
  - {case_id: ft_share_by_method, feature: share_of_total, question: "各付款方式的收款佔比", note: "answerable since the share algebra", expected: {status: answered}, reference_sql: "SELECT payment_method, CAST(SUM(payment_amount) AS DOUBLE PRECISION) / NULLIF(SUM(SUM(payment_amount)) OVER (), 0) FROM pos_payment GROUP BY 1"}
  # --- pinned after the owner's ratio review of 2026-09-10 (docs/research/ratios-01.md)
  - {case_id: ft_share_one_store, feature: share_subset, question: "特約新店遠東的營業額占全部門市營業額的比例", note: "a share asked for one group: the filter on the grouped column selects the row after the share, the total still covers every store (real-DB h2_q21 came back as 1.0 before the rule)", expected: {status: answered}, reference_sql: "SELECT store_name, share FROM (SELECT s.store_name, CAST(SUM(p.total_amount) AS DOUBLE PRECISION) / NULLIF(SUM(SUM(p.total_amount)) OVER (), 0) AS share FROM pos_sale p LEFT JOIN store s ON s.store_id = p.store_id GROUP BY 1) t WHERE store_name = '特約新店遠東'"}
  - {case_id: ft_last_30_days, feature: time_relative_days, question: "最近 30 天的營業額", note: "the model tends to write offset 0 length 30, a window that runs into the future; the repair reads it as the 30 complete days before as_of (real-DB b1_q34 answered 0 before the repair)", expected: {status: answered}, reference_sql: "SELECT SUM(total_amount) FROM pos_sale WHERE sale_date >= '2026-01-11T00:00+08' AND sale_date < '2026-02-10T00:00+08'"}
  - {case_id: ft_share_same_period_no_grain, feature: share_of_total, question: "各門市的營業額占同期全部營業額的比例", note: "同期 with no period word is one whole-window share; a grain the model adds without a per-period word is dropped (real-DB b1_q21 wobbled between 25 and 61 rows)", expected: {status: answered}, reference_sql: "SELECT s.store_name, CAST(SUM(p.total_amount) AS DOUBLE PRECISION) / NULLIF(SUM(SUM(p.total_amount)) OVER (), 0) AS share FROM pos_sale p LEFT JOIN store s ON s.store_id = p.store_id GROUP BY 1"}
  # --- follow-ups (multi-turn)
  - {case_id: fu_base_store_dec, feature: follow_up_anchor, question: "2025年12月各門市的營業額", expected: {status: answered}, reference_sql: "SELECT s.store_name, SUM(p.total_amount) FROM pos_sale p JOIN store s ON s.store_id = p.store_id WHERE p.sale_date >= '2025-12-01T00:00+08' AND p.sale_date < '2026-01-01T00:00+08' GROUP BY 1"}
  - {case_id: fu_change_month, feature: follow_up_time, follow_up_of: fu_base_store_dec, question: "那1月呢？", expected: {status: answered}, reference_sql: "SELECT s.store_name, SUM(p.total_amount) FROM pos_sale p JOIN store s ON s.store_id = p.store_id WHERE p.sale_date >= '2026-01-01T00:00+08' AND p.sale_date < '2026-02-01T00:00+08' GROUP BY 1"}
  - {case_id: fu_base_payment, feature: follow_up_anchor, question: "各付款方式的收款總額", expected: {status: answered}, reference_sql: "SELECT payment_method, SUM(payment_amount) FROM pos_payment GROUP BY 1"}
  - {case_id: fu_add_time, feature: follow_up_add_time, follow_up_of: fu_base_payment, question: "只看2025年12月", expected: {status: answered}, reference_sql: "SELECT pp.payment_method, SUM(pp.payment_amount) FROM pos_payment pp JOIN pos_sale s ON s.transaction_no = pp.transaction_no WHERE s.sale_date >= '2025-12-01T00:00+08' AND s.sale_date < '2026-01-01T00:00+08' GROUP BY 1"}
  - {case_id: fu_base_headcount, feature: follow_up_anchor, question: "各部門人數", expected: {status: answered}, reference_sql: "SELECT d.dept_name, COUNT(*) FROM hr_employee e JOIN hr_dept d ON d.dept_id = e.dept_id GROUP BY 1"}
  - {case_id: fu_add_filter, feature: follow_up_add_filter, follow_up_of: fu_base_headcount, question: "只算在職的", expected: {status: answered}, reference_sql: "SELECT d.dept_name, COUNT(*) FROM hr_employee e JOIN hr_dept d ON d.dept_id = e.dept_id WHERE e.terminated_at IS NULL GROUP BY 1"}
  - {case_id: fu_base_top3, feature: follow_up_anchor, question: "銷售金額最高的前三個商品", expected: {status: answered}, reference_sql: "SELECT p.product_name, SUM(i.amount) AS s FROM pos_saleitem i JOIN product p ON p.product_id = i.product_id GROUP BY 1 ORDER BY s DESC LIMIT 3"}
  - {case_id: fu_change_limit, feature: follow_up_limit, follow_up_of: fu_base_top3, question: "改成前五名", expected: {status: answered}, reference_sql: "SELECT p.product_name, SUM(i.amount) AS s FROM pos_saleitem i JOIN product p ON p.product_id = i.product_id GROUP BY 1 ORDER BY s DESC LIMIT 5"}
  - {case_id: fu_base_total, feature: follow_up_anchor, question: "2025年12月的總營業額", expected: {status: answered}, reference_sql: "SELECT SUM(total_amount) FROM pos_sale WHERE sale_date >= '2025-12-01T00:00+08' AND sale_date < '2026-01-01T00:00+08'"}
  - {case_id: fu_add_dimension, feature: follow_up_breakdown, follow_up_of: fu_base_total, question: "按門市拆開", expected: {status: answered}, reference_sql: "SELECT s.store_name, SUM(p.total_amount) FROM pos_sale p JOIN store s ON s.store_id = p.store_id WHERE p.sale_date >= '2025-12-01T00:00+08' AND p.sale_date < '2026-01-01T00:00+08' GROUP BY 1"}
  - {case_id: fu_base_active, feature: follow_up_anchor, question: "目前在職員工有幾位", expected: {status: answered}, reference_sql: "SELECT COUNT(*) FROM hr_employee WHERE terminated_at IS NULL"}
  - {case_id: fu_breakdown_dept, feature: follow_up_breakdown, follow_up_of: fu_base_active, question: "各部門呢", expected: {status: answered}, reference_sql: "SELECT d.dept_name, COUNT(*) FROM hr_employee e JOIN hr_dept d ON d.dept_id = e.dept_id WHERE e.terminated_at IS NULL GROUP BY 1"}
  - {case_id: fu_new_topic, feature: follow_up_new_topic, follow_up_of: fu_base_active, question: "2026年1月有幾筆交易", note: "a new question must ignore the previous turn", expected: {status: answered}, reference_sql: "SELECT COUNT(*) FROM pos_sale WHERE sale_date >= '2026-01-01T00:00+08' AND sale_date < '2026-02-01T00:00+08'"}
