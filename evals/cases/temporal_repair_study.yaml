selections:
  - {file: evals/cases/tier0/iot_date_acceptance.yaml, route: legacy, ordered: true}
  - file: evals/cases/tier0/iot.yaml
    route: legacy
    ids: [offline_devices_count]
  - file: evals/cases/tier0/coverage_iot.yaml
    route: decline
    ids: [cov_mttr, cov_leased_fee]
new_cases:
  - case_id: precision_noon_zh
    datasource_id: iot_spike
    as_of: "2026-08-15T12:00:00+08:00"
    question: "按台北時間每日統計告警筆數，範圍從2026-07-01 00:00包含起點，到2026-07-08 12:00不含終點。"
    expected_route: legacy
    ordered: true
    reference_sql: "SELECT date_trunc('day',raised_at AT TIME ZONE 'Asia/Taipei'),count(*) FROM alerts WHERE raised_at >= '2026-07-01T00:00:00+08:00' AND raised_at < '2026-07-08T12:00:00+08:00' GROUP BY 1 ORDER BY 1"
  - case_id: precision_noon_ja
    datasource_id: iot_spike
    as_of: "2026-08-15T12:00:00+08:00"
    question: "台北時間の2026-07-01 00:00以上、2026-07-08 12:00未満のアラート件数を日別に集計してください。"
    expected_route: legacy
    ordered: true
    reference_sql: "SELECT date_trunc('day',raised_at AT TIME ZONE 'Asia/Taipei'),count(*) FROM alerts WHERE raised_at >= '2026-07-01T00:00:00+08:00' AND raised_at < '2026-07-08T12:00:00+08:00' GROUP BY 1 ORDER BY 1"
  - case_id: precision_utc_equivalent
    datasource_id: iot_spike
    as_of: "2026-08-15T12:00:00+08:00"
    question: "Count alerts per Taipei calendar day from 2026-06-30T16:00:00Z inclusive until 2026-07-08T04:00:00Z exclusive."
    expected_route: legacy
    ordered: true
    reference_sql: "SELECT date_trunc('day',raised_at AT TIME ZONE 'Asia/Taipei'),count(*) FROM alerts WHERE raised_at >= '2026-06-30T16:00:00Z' AND raised_at < '2026-07-08T04:00:00Z' GROUP BY 1 ORDER BY 1"
  - case_id: precision_fractional_count
    datasource_id: iot_spike
    as_of: "2026-08-15T12:00:00+08:00"
    question: "How many alerts have raised_at >= 2026-07-08T11:59:59.500000+08:00 and raised_at < 2026-07-08T12:00:00.500000+08:00? Give one total, no grouping."
    expected_route: legacy
    reference_sql: "SELECT count(*) FROM alerts WHERE raised_at >= '2026-07-08T11:59:59.500000+08:00' AND raised_at < '2026-07-08T12:00:00.500000+08:00'"
  - case_id: precision_without_alerts
    datasource_id: iot_spike
    as_of: "2026-08-15T12:00:00+08:00"
    question: "How many devices have no alerts with raised_at from 2026-07-08T00:00:00+08:00 inclusive until 2026-07-08T12:00:00+08:00 exclusive? Include devices that never had alerts. Give one total."
    expected_route: legacy
    reference_sql: "SELECT count(*) FROM devices d WHERE NOT EXISTS (SELECT 1 FROM alerts a WHERE a.device_id=d.device_id AND a.raised_at >= '2026-07-08T00:00:00+08:00' AND a.raised_at < '2026-07-08T12:00:00+08:00')"
  - case_id: precision_service_logs
    datasource_id: service_test
    as_of: "2026-04-15T12:00:00+08:00"
    question: "Count work_logs records with logged_at from 2026-02-02T12:00:00+08:00 inclusive until 2026-02-05T12:00:00+08:00 exclusive. Give one total."
    expected_route: legacy
    reference_sql: "SELECT count(*) FROM work_logs WHERE logged_at >= '2026-02-02T12:00:00+08:00' AND logged_at < '2026-02-05T12:00:00+08:00'"
  - case_id: precision_calendar_control
    datasource_id: iot_spike
    as_of: "2026-08-15T12:00:00+08:00"
    question: "How many alerts were raised during July 2026 in Taipei time? Give one total."
    expected_route: legacy
    reference_sql: "SELECT count(*) FROM alerts WHERE raised_at >= '2026-07-01T00:00:00+08:00' AND raised_at < '2026-08-01T00:00:00+08:00'"
