<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grepbit · Local E2E</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main>
<header><span class="tag">LOCAL / E2E</span><h1>Grepbit</h1><p>一個問題，一次受控查詢。直接看結果，也看計算口徑。</p></header>
<form id="query"><div class="inputs"><label>測試資料源<select id="datasource" required></select></label><label>報表基準時間（ISO）<input id="asof" required placeholder="2026-08-15T12:00:00+08:00" autocomplete="off"></label></div>
<label>你的問題<textarea id="question" required maxlength="4000" rows="3" placeholder="例如：離線裝置有幾台？"></textarea></label>
<div class="actions"><button id="submit" type="submit">開始查詢</button><button id="stop" type="button" disabled>停止</button><span id="progress" role="status" aria-live="polite">準備就緒</span></div></form>
<section id="result" hidden aria-label="查詢結果"><div class="result-head"><h2 id="status"></h2><span id="identity"></span></div><p id="answered-question"></p><p id="verification"></p><h3>實際計算口徑</h3><p id="interpretation"></p><p id="refusal"></p>
<h3>假設與限制</h3><ul id="assumptions"></ul><ul id="warnings"></ul><p id="rowmeta"></p><div class="table-wrap"><table id="rows"></table></div>
<details><summary>查看結構化證據與 SQL（原始工具結果）</summary><pre id="evidence"></pre></details></section>
<footer>僅供本機合成資料測試 · 不儲存查詢紀錄 · 非意圖正確性認證<br>進度串流不是模型逐字輸出；數值只在查詢完成後顯示。</footer>
</main></body></html>
